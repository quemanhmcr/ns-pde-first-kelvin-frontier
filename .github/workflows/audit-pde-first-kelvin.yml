name: Audit PDE-first Kelvin frontier

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit classification and anti-overclaim guards
        run: python scripts/audit_classification.py
      - name: Check whitespace
        run: git show --check --oneline --no-renames HEAD
      - name: Audit pair-localization frontier coverage
        run: python scripts/audit_frontier_coverage.py

  symbolic-identities:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install symbolic audit dependency
        run: python -m pip install --disable-pip-version-check -r requirements-audit.txt
      - name: Run exact symbolic identities
        run: python -m unittest -v tests.test_symbolic_identities

  exact-ns-calibration:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run exact smooth Navier-Stokes shear calibration regressions
        run: python -m unittest -v tests.test_exact_shear_calibration
      - name: Build closed-form calibration report
        if: matrix.python-version == '3.12'
        run: python scripts/build_exact_shear_report.py
      - name: Upload exact calibration artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: exact-shear-calibration
          path: audit-results/exact_shear_report.json

  pair-localization-worldsheet:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Audit pair-localization world-sheet and exact NS refinement covariance
        run: python -m unittest -v tests.test_pair_localization_worldsheet tests.test_pair_quantile_leakage tests.test_pair_shell_exit
      - name: Build pair-worldsheet artifact
        if: matrix.python-version == '3.12'
        run: python scripts/build_pair_worldsheet_report.py
      - name: Upload pair-worldsheet artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: pair-localization-worldsheet
          path: audit-results/pair_worldsheet_report.json

  active-first-bad-pair-audit:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install symbolic audit dependency
        run: python -m pip install --disable-pip-version-check -r requirements-audit.txt
      - name: Audit literal active-map pair commutator algebra and exact NS counterpressure
        run: python -m unittest -v tests.test_active_first_bad_pair_maps
      - name: Build active first-bad pair audit artifact
        if: matrix.python-version == '3.12'
        run: python scripts/build_active_pair_report.py
      - name: Upload active first-bad pair audit artifact
        if: matrix.python-version == '3.12'
